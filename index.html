<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Database Practice Website</title>
  <style>
    :root { --bg:#eef3f8; --panel:#ffffff; --ink:#0f172a; --muted:#475569; --accent:#0f766e; --line:#d8e1eb; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Segoe UI, Tahoma, sans-serif; background:linear-gradient(180deg,#f8fbff,#eef3f8); color:var(--ink); }
    .wrap { max-width:1000px; margin:0 auto; padding:28px 16px 40px; }
    .hero { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:16px; }
    h1 { margin:0 0 8px; font-size:1.9rem; }
    .sub { margin:0; color:var(--muted); }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; }
    .week { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; }
    .week h2 { margin:0 0 6px; font-size:1.1rem; color:#115e59; }
    .week p { margin:0 0 10px; color:var(--muted); }
    .links { display:flex; gap:8px; flex-wrap:wrap; }
    .links a { text-decoration:none; background:#0f766e; color:#fff; padding:7px 10px; border-radius:8px; font-size:.92rem; font-weight:600; }
    .links a:last-child { background:#0b4f6c; }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>Introduction to Database Systems Practice Website</h1>
      <p class="sub">Each week now has two pages: Read Page and Test Page. Test page supports per-question submit and evaluation.</p>
    </section>
    <p>Answers are wrong.</p>
  </main>
</body>
</html>
