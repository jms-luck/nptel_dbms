<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 1 - Page Selector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f4f7ff 0%, #e6eefc 100%);
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            width: min(420px, 92vw);
            text-align: center;
        }
        h1 {
            margin-top: 0;
            color: #1b365d;
        }
        .btn {
            display: block;
            text-decoration: none;
            margin: 12px 0;
            padding: 12px 16px;
            border-radius: 8px;
            font-weight: bold;
            color: #ffffff;
        }
        .reading {
            background: #1f7a8c;
        }
        .testing {
            background: #bf1363;
        }
            .home-btn {
            position: fixed;
            top: 14px;
            right: 14px;
            z-index: 9999;
            text-decoration: none;
            background: #0f4c81;
            color: #ffffff;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .home-btn:hover {
            background: #0b3a63;
        }
    </style>
</head>
<body>
    <a class="home-btn" href="home.html" title="Go to Home">Home</a>
    <div class="card">
        <h1>Week 1</h1>
        <p>Select the page you want to open.</p>
        <a class="btn reading" href="week1-reading.html">Open Reading Page</a>
        <a class="btn testing" href="week1-testing.html">Open Testing Page</a>
    </div>
</body>
</html>
