<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPTEL Login</title>
    <style>
        :root {
            --bg1: #f6fff8;
            --bg2: #dff5e8;
            --card: #ffffff;
            --accent: #14746f;
            --accent-2: #1b4332;
            --text: #1f2937;
            --muted: #4b5563;
            --danger: #b42318;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at top right, var(--bg2), var(--bg1));
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text);
            padding: 16px;
        }

        .login-card {
            width: min(420px, 100%);
            background: var(--card);
            border-radius: 14px;
            padding: 28px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.14);
        }

        h1 {
            margin: 0 0 6px;
            color: var(--accent-2);
            text-align: center;
            font-size: 1.7rem;
        }

        .subtitle {
            margin: 0 0 20px;
            text-align: center;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .hint {
            margin-bottom: 18px;
            border-left: 4px solid var(--accent);
            background: #ecfdf5;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.92rem;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            font-weight: 600;
        }

        input {
            width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 1rem;
        }

        input:focus {
            outline: 2px solid #94d2bd;
            border-color: #2a9d8f;
        }

        button {
            width: 100%;
            margin-top: 16px;
            border: 0;
            border-radius: 10px;
            padding: 11px;
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(90deg, #1b4332, #14746f);
            cursor: pointer;
        }

        .error {
            min-height: 22px;
            margin-top: 10px;
            color: var(--danger);
            font-size: 0.92rem;
            text-align: center;
            font-weight: 600;
        }
            .home-btn {
            position: fixed;
            top: 14px;
            right: 14px;
            z-index: 9999;
            text-decoration: none;
            background: #0f4c81;
            color: #ffffff;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .home-btn:hover {
            background: #0b3a63;
        }
    </style>
</head>
<body>
    <a class="home-btn" href="home.html" title="Go to Home">Home</a>
    <main class="login-card">
        <h1>NPTEL Practice Login</h1>
        <p class="subtitle">Sign in to open your week pages</p>

        <div class="hint">
            Default username: <strong>my nickname</strong><br>
            Default password: <strong>my nickname +123</strong>
        </div>

        <form id="loginForm">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <button type="submit">Login</button>
            <div id="error" class="error" aria-live="polite"></div>
        </form>
    </main>

    <script>
        const DEFAULT_USERNAME = "meena";
        const DEFAULT_PASSWORD = "meena123";

        // Keep auth lightweight for static pages.
        if (localStorage.getItem("nptelAuth") === "true") {
            window.location.href = "home.html";
        }

        document.getElementById("loginForm").addEventListener("submit", function (event) {
            event.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const error = document.getElementById("error");

            if (username === DEFAULT_USERNAME && password === DEFAULT_PASSWORD) {
                localStorage.setItem("nptelAuth", "true");
                localStorage.setItem("nptelUser", username);
                window.location.href = "home.html";
                return;
            }

            error.textContent = "Invalid username or password.";
        });
    </script>
</body>
</html>
